apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - staging.artechworld.info
    secretName: ecommerce-tls
  rules:
  - host: staging.artechworld.info
    http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: ecommerce-frontend-service
            port:
              number: 80
      - path: "/api/products"
        pathType: Prefix
        backend:
          service:
            name: ecommerce-backend-product-service
            port:
              number: 80
      - path: "/api/orders"
        pathType: Prefix
        backend:
          service:
            name: ecommerce-backend-order-service
            port:
              number: 80
      - path: "/api/cart"
        pathType: Prefix
        backend:
          service:
            name: ecommerce-backend-cart-service
            port:
              number: 80


