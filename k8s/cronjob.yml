apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-secret-refresh
  namespace: ecommerce
spec:
  schedule: "0 */10 * * *"   # every 10 hours
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: refresh
            image: amazon/aws-cli
            command:
              - /bin/sh
              - -c
              - |
                PASSWORD=$(aws ecr get-login-password --region us-east-1)
                kubectl delete secret ecr-secret -n ecommerce --ignore-not-found
                kubectl create secret docker-registry ecr-secret \
                  --docker-server=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com \
                  --docker-username=AWS \
                  --docker-password=$PASSWORD \
                  -n ecommerce
          restartPolicy: OnFailure