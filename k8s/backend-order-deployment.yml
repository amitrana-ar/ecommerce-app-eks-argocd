kind: Deployment 
apiVersion: apps/v1
metadata:
  name: backend-order-deployment
  namespace: ecommerce
  labels:
    app: backend-order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-order
  template:
    metadata:
      labels:
        app: backend-order
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: ecommerce-backend-order
          image: 727646469309.dkr.ecr.ap-south-1.amazonaws.com/ecommerce-order:8e7e29ea340912508369e829390d37fe61566f73
          command: ["npm", "run", "start:order"]
          ports:
            - containerPort: 5003
          envFrom:
            - secretRef:
                name: dev-eks-argocd-secret
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "250m"
              memory: "128Mi"