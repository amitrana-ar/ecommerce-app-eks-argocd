kind: Deployment 
apiVersion: apps/v1
metadata:
  name: backend-cart-deployment
  namespace: ecommerce
  labels:
    app: backend-cart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-cart
  template:
    metadata:
      labels:
        app: backend-cart
    spec:
      imagePullSecrets:
              - name: ecr-secret        
      containers:
        - name: ecommerce-backend-cart
          image: 727646469309.dkr.ecr.ap-south-1.amazonaws.com/ecommerce-cart:8e7e29ea340912508369e829390d37fe61566f73
          command: ["npm", "run", "start:cart"]
          ports:
            - containerPort: 5002
          envFrom:
            - secretRef:
                name: dev-eks-argocd-secret
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "250m"
              memory: "128Mi"
