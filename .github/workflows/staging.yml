name: Build & Push Images

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: <aws-account-id>.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
          | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build & Push Images
        run: |
          docker build -t $ECR_REGISTRY/ecommerce-cart:$TAG .
          docker push $ECR_REGISTRY/ecommerce-cart:$TAG

          docker build -t $ECR_REGISTRY/ecommerce-order:$TAG .
          docker push $ECR_REGISTRY/ecommerce-order:$TAG 

          docker build -t $ECR_REGISTRY/ecommerce-product:$TAG .
          docker push $ECR_REGISTRY/ecommerce-product:$TAG  

          docker build -t $ECR_REGISTRY/ecommerce-frontend:$TAG .
          docker push $ECR_REGISTRY/ecommerce-frontend:$TAG

      # 🔥 Update YAML (KEY STEP)
      - name: Update Deployment YAML
        run: |
          sed -i "s|ecommerce-frontend:.*|ecommerce-frontend:$TAG|" k8s/frontend-deployment.yml
          sed -i "s|ecommerce-cart:.*|ecommerce-cart:$TAG|" k8s/backend-cart-deployment.yml
          sed -i "s|ecommerce-order:.*|ecommerce-order:$TAG|" k8s/backend-order-deployment.yml
          sed -i "s|ecommerce-product:.*|ecommerce-product:$TAG|" k8s/backend-product-deployment.yml

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "update image to $TAG"
          git push